<!DOCTYPE html>

<meta charset="utf-8">

<style>
  :root{
    --bg:#f3f4f6; --ink:#1b1f27; --muted:#666c7b; --line:#d5d8df;
    --accent:#a41034; --accent-ink:#ffffff;
    --serif:"Iowan Old Style","Charter","Georgia",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#16181d; --ink:#eceef2; --muted:#9aa1b0; --line:#2e323b; --accent:#e0506f; --accent-ink:#16181d; }
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;min-height:100%}
  main{flex:1;display:flex;flex-direction:column;justify-content:center;max-width:52rem;width:100%;margin:0 auto;padding:2rem 1.5rem}
  .intro{color:var(--muted);font-size:.95rem;margin:0 0 2rem;max-width:38rem;line-height:1.5}
  .topic{color:var(--muted);font-size:.9rem;margin:0 0 .75rem;min-height:1.3em}
  .question{font-family:var(--serif);font-size:clamp(1.6rem,4.2vw,2.6rem);line-height:1.3;margin:0 0 2.5rem;min-height:6.5em;font-weight:400;text-wrap:balance}
  .question.empty{color:var(--muted)}
  .bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:1rem}
  .fill{height:100%;width:100%;background:var(--accent);transform-origin:left}
  .clock{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:1.5rem}
  .time{font-family:var(--serif);font-size:clamp(3.5rem,11vw,6rem);line-height:1;font-variant-numeric:tabular-nums}
  .time.over{color:var(--accent)}
  .status{color:var(--muted);font-size:.95rem}
  .controls{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center}
  button,select{font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:6px;padding:.65rem 1rem;cursor:pointer}
  button:hover,select:hover{border-color:var(--muted)}
  button:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;padding:.75rem 1.5rem}
  button.primary:hover{filter:brightness(1.08)}
  .row{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.25rem}
  label{color:var(--muted);font-size:.9rem;display:flex;align-items:center;gap:.5rem}
  footer{padding:1rem 1.5rem 1.5rem;color:var(--muted);font-size:.8rem;text-align:center;line-height:1.5}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="intro">Practice answering academic job market interview questions out loud. Each question starts a timer. Space for the next question, P to pause.</p>
  <p class="topic" id="topic"></p>
  <h1 class="question empty" id="q" aria-live="polite">Press Next question to begin.</h1>
  <div class="clock">
    <div class="time" id="time">0:30</div>
    <div class="status" id="status"></div>
  </div>
  <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>
  <div class="controls">
    <button class="primary" id="next">Next question</button>
    <button id="pause">Pause</button>
    <button id="restart">Restart timer</button>
  </div>
  <div class="row">
    <label>Topic <select id="cat"></select></label>
    <label>Timer
      <select id="len">
        <option value="30" selected>30 sec</option>
        <option value="60">1 min</option>
        <option value="90">90 sec</option>
        <option value="120">2 min</option>
        <option value="180">3 min</option>
      </select>
    </label>
  </div>
</main>
<footer id="foot"></footer>

const $ = id => document.getElementById(id);
let all = [], deck = [], seen = 0, source = '';
let total = 30, left = 30, running = false, timer = null, endAt = 0, started = false;

function parse(text){
  const out = []; let cat = 'General';
  for (let line of text.split(/\r?\n/)){
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('## ')){ cat = line.slice(3).trim(); continue; }
    if (line.startsWith('#')) continue;
    out.push({c: cat, q: line});
  }
  return out;
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pool(){ const c = $('cat').value; return c === '*' ? all : all.filter(x => x.c === c); }
function buildDeck(){ deck = shuffle(pool()); seen = 0; }
function buildTopics(){
  const sel = $('cat'); sel.innerHTML = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  add('*', 'All topics');
  [...new Set(all.map(x => x.c))].forEach(c => add(c, c));
}
async function load(){
  try {
    const r = await fetch('questions.txt', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const qs = parse(await r.text());
    if (!qs.length) throw new Error('empty');
    all = qs; source = 'questions.txt';
  } catch (e) { all = FALLBACK.slice(); source = 'built-in list'; }
  buildTopics(); buildDeck(); foot();
}
function foot(){
  const n = pool().length;
  $('foot').innerHTML = (started ? 'Question ' + seen + ' of ' + n + ' this round. ' : n + ' questions. ') +
    'Crowdsourced from candidate reports; not affiliated with or endorsed by any school.';
}
function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0'); }
function render(){
  $('time').textContent = fmt(left);
  $('time').classList.toggle('over', left <= 0);
  $('fill').style.transform = 'scaleX(' + Math.max(0, left / total) + ')';
  $('status').textContent = !started ? '' : left <= 0 ? 'Time' : running ? '' : 'Paused';
}
function tick(){ left = (endAt - Date.now()) / 1000; if (left <= 0){ left = 0; stop(); } render(); }
function start(){
  if (left <= 0) return;
  running = true; endAt = Date.now() + left * 1000;
  clearInterval(timer); timer = setInterval(tick, 200);
  $('pause').textContent = 'Pause'; render();
}
function stop(){ running = false; clearInterval(timer); $('pause').textContent = 'Resume'; render(); }
function nextQuestion(){
  if (!pool().length) return;
  if (!deck.length) buildDeck();
  const it = deck.pop(); seen++;
  $('q').textContent = it.q; $('q').classList.remove('empty');
  $('topic').textContent = it.c;
  total = left = parseInt($('len').value, 10);
  started = true; start(); foot();
}
function restart(){ if (!started) return; left = total = parseInt($('len').value, 10); start(); }
function togglePause(){ if (!started) return; if (running) stop(); else if (left > 0) start(); }

$('next').addEventListener('click', nextQuestion);
$('restart').addEventListener('click', restart);
$('pause').addEventListener('click', togglePause);
$('len').addEventListener('change', () => { total = left = parseInt($('len').value, 10); if (started) start(); else render(); });
$('cat').addEventListener('change', () => { buildDeck(); foot(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); nextQuestion(); }
  else if (e.key === 'p' || e.key === 'P') togglePause();
});
load().then(render);
