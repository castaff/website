  <!-- Site-wide stylesheet and favicon, one level up. Relative paths so they resolve at any base URL. -->
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <style>
    /* Layout only. Fonts, colors, and heading styles come from the site stylesheet. */
    :root{ --accent:#a41034; --accent-ink:#fff; --display:inherit; --rule:color-mix(in srgb, currentColor 22%, transparent); }
    .practice .lede{margin:0 0 1.25rem}
    .topic{margin:0 0 .25rem;font-size:.9em;opacity:.7;min-height:1.3em}
    .question{font-family:var(--display);font-size:clamp(1.35rem,3.4vw,1.9rem);line-height:1.3;font-weight:400;margin:0 0 1rem;min-height:3.9em;text-wrap:balance}
    .question.empty{opacity:.6}
    .clock{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:.4rem}
    .time{font-family:var(--display);font-size:clamp(2.4rem,7vw,3.4rem);line-height:1;font-variant-numeric:tabular-nums}
    .time.over{color:var(--accent)}
    .status{font-size:.9em;opacity:.7}
    .bar{height:4px;background:var(--rule);border-radius:2px;overflow:hidden;margin-bottom:1rem}
    .fill{height:100%;width:100%;background:var(--accent);transform-origin:left}
    .controls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
    .practice button,.practice select{font:inherit;font-size:.95em;color:inherit;background:transparent;border:1px solid var(--rule);border-radius:6px;padding:.5rem .85rem;cursor:pointer}
    .practice button:hover,.practice select:hover{border-color:currentColor}
    .practice button:focus-visible,.practice select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
    .practice button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600;padding:.55rem 1.25rem}
    .practice button.primary:hover{filter:brightness(1.08)}
    .practice label{display:flex;align-items:center;gap:.4rem;font-size:.9em;opacity:.85}
    .practice .grow{flex:1}
    .practice-foot{margin-top:1.25rem;font-size:.8em;opacity:.65;line-height:1.5}
    @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>

        <p class="lede">Practice answering academic job market questions out loud. Each question starts a timer. Space for the next question, P to pause. </p>

        <p class="topic" id="topic"></p>
        <h3 class="question empty" id="q" aria-live="polite">Press Next question to begin.</h3>

        <div class="clock">
          <div class="time" id="time">1:00</div>
          <div class="status" id="status"></div>
        </div>
        <div class="bar" aria-hidden="true"><div class="fill" id="fill"></div></div>

        <div class="controls">
          <button class="primary" id="next">Next question</button>
          <button id="pause">Pause</button>
          <button id="restart">Restart</button>
          <span class="grow"></span>
          <label>Topic <select id="cat"></select></label>
          <label>Timer
            <select id="len">

              <option value="60" selected>1 min</option>
              <option value="90">90 sec</option>
              <option value="120">2 min</option>
              <option value="180">3 min</option>
            </select>
          </label>
        </div>

        <p class="practice-foot" id="foot"></p>
      </section>
    </div>
  </main>

const $ = id => document.getElementById(id);
let all = [], deck = [], seen = 0;
let total = 60, left = 60, running = false, timer = null, endAt = 0, started = false;

/* Borrow heading font and link color from the site stylesheet so this page stays in sync with it. */
function themeFromSite(){
  const root = document.documentElement;
  const h = document.querySelector('.page-title');
  if (h) root.style.setProperty('--display', getComputedStyle(h).fontFamily);
  const a = document.querySelector('.lede a');
  if (a) root.style.setProperty('--accent', getComputedStyle(a).color);
  const bg = getComputedStyle(document.body).backgroundColor;
  root.style.setProperty('--accent-ink', (!bg || bg === 'transparent' || bg === 'rgba(0, 0, 0, 0)') ? '#fff' : bg);
}
themeFromSite();
window.addEventListener('load', themeFromSite);

function parse(text){
  const out = []; let cat = 'General';
  for (let line of text.split(/\r?\n/)){
    line = line.trim();
    if (!line) continue;
    if (line.startsWith('## ')){ cat = line.slice(3).trim(); continue; }
    if (line.startsWith('#')) continue;
    out.push({c: cat, q: line});
  }
  return out;
}
function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function pool(){ const c = $('cat').value; return c === '*' ? all : all.filter(x => x.c === c); }
function buildDeck(){ deck = shuffle(pool()); seen = 0; }
function buildTopics(){
  const sel = $('cat'); sel.innerHTML = '';
  const add = (v, t) => { const o = document.createElement('option'); o.value = v; o.textContent = t; sel.appendChild(o); };
  add('*', 'All topics');
  [...new Set(all.map(x => x.c))].forEach(c => add(c, c));
}
async function load(){
  try {
    const r = await fetch('questions.txt', {cache:'no-store'});
    if (!r.ok) throw new Error(r.status);
    const qs = parse(await r.text());
    if (!qs.length) throw new Error('empty');
    all = qs;
  } catch (e) { all = FALLBACK.slice(); }
  buildTopics(); buildDeck(); foot();
}
function foot(){
  const n = pool().length;
  $('foot').textContent = (started ? 'Question ' + seen + ' of ' + n + ' this round. ' : n + ' questions. ') +
    'Crowdsourced from candidate reports, reddit, my brain, interviews I have had, friends etc. If you think anything should be added shoot me an email.';
}
function fmt(s){ s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s % 60).padStart(2,'0'); }
function render(){
  $('time').textContent = fmt(left);
  $('time').classList.toggle('over', left <= 0);
  $('fill').style.transform = 'scaleX(' + Math.max(0, left / total) + ')';
  $('status').textContent = !started ? '' : left <= 0 ? 'Time' : running ? '' : 'Paused';
}
function tick(){ left = (endAt - Date.now()) / 1000; if (left <= 0){ left = 0; stop(); } render(); }
function start(){
  if (left <= 0) return;
  running = true; endAt = Date.now() + left * 1000;
  clearInterval(timer); timer = setInterval(tick, 200);
  $('pause').textContent = 'Pause'; render();
}
function stop(){ running = false; clearInterval(timer); $('pause').textContent = 'Resume'; render(); }
function nextQuestion(){
  if (!pool().length) return;
  if (!deck.length) buildDeck();
  const it = deck.pop(); seen++;
  $('q').textContent = it.q; $('q').classList.remove('empty');
  $('topic').textContent = it.c;
  total = left = parseInt($('len').value, 10);
  started = true; start(); foot();
}
function restart(){ if (!started) return; left = total = parseInt($('len').value, 10); start(); }
function togglePause(){ if (!started) return; if (running) stop(); else if (left > 0) start(); }

$('next').addEventListener('click', nextQuestion);
$('restart').addEventListener('click', restart);
$('pause').addEventListener('click', togglePause);
$('len').addEventListener('change', () => { total = left = parseInt($('len').value, 10); if (started) start(); else render(); });
$('cat').addEventListener('change', () => { buildDeck(); foot(); });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  if (e.code === 'Space'){ e.preventDefault(); nextQuestion(); }
  else if (e.key === 'p' || e.key === 'P') togglePause();
});
load().then(render);
</script>
